<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#1d1d1b">
    <meta name="description" content="Diez preguntas, tu propia onda. Descubrí qué música va con vos y encontrá tu groove rosarino.">
    <title>Encontrá tu groove · Quiz musical</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23EA562A'/%3E%3Ctext x='14' y='47' font-size='44' fill='white'%3E♪%3C/text%3E%3C/svg%3E">
    <link rel="preload" href="assets/Pantalla%20inicio.svg" as="image">
    <link rel="preload" href="assets/fonts/Poppins-SemiBold.ttf" as="font" type="font/ttf" crossorigin>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/quiz-data.js" defer></script>
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <div class="quiz-layout">
    <main id="quiz" class="quiz" aria-label="Encontrá tu groove">
      <img id="screen-art" class="screen-art" src="assets/Pantalla%20inicio.svg" alt="" aria-hidden="true" fetchpriority="high">
      <section id="start-screen" class="screen start-screen" aria-labelledby="start-title">
        <p class="brand-tagline">Museo del groove</p>
        <h1 id="start-title" tabindex="-1">Te damos la bienvenida<br>a nuestro test!</h1>
        <button id="play-button" class="play-button" type="button" aria-label="Play">
          <img src="imagens/Boton%20play.svg" alt="" aria-hidden="true">
        </button>
      </section>
      <section id="question-screen" class="screen question-screen" aria-labelledby="question-title" hidden>
        <h2 id="question-title" class="sr-only" tabindex="-1"></h2>
        <div id="answers" class="answers" role="group" aria-labelledby="question-title"></div>
        <nav class="question-navigation" aria-label="Navegación del test">
          <button id="back-button" class="text-button" type="button">← Volver</button>
          <span id="progress-label" class="progress-label"></span>
          <div id="progress" class="progress" role="progressbar" aria-label="Preguntas respondidas" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><span></span></div>
        </nav>
      </section>
      <section id="loading-screen" class="screen loading-screen" aria-labelledby="loading-title" hidden>
        <h2 id="loading-title" tabindex="-1">Estamos buscando tu groove</h2>
        <div class="equalizer" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
        <p>Bancá un toque…</p>
      </section>
      <section id="result-screen" class="screen result-screen" aria-labelledby="result-title" hidden>
        <h2 id="result-title" class="sr-only" tabindex="-1"></h2>
      </section>
      <p id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
      <noscript><p class="noscript">Activá JavaScript en tu navegador para jugar.</p></noscript>
    </main>
    </div>
  </body>
</html>
